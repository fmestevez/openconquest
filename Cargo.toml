[workspace]
resolver = "2"
members = ["crates/formats", "crates/extract", "crates/game"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
openconquest-formats = { path = "crates/formats" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
memmap2 = "0.9"
png = "0.18"
winit = "0.30"
softbuffer = "0.4"
rodio = { version = "0.19", default-features = false, features = ["wav", "flac", "vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustysynth = "1.3"
rfd = "0.15"
dirs = "6"
flate2 = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
